name: refresh-data
on:
  schedule:
    - cron: "7,27,47 * * * *"   # every 20 min
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", ".github/workflows/**"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch live corridor data (MDT, ITD, NWS, AWC)
        run: python3 scripts/fetch.py
      - name: Commit route cache only (data.json is deployed, not committed)
        run: |
          git config user.name "haul-bot"; git config user.email "haul-bot@users.noreply.github.com"
          git add site/data/routes.json || true
          git diff --cached --quiet || (git commit -m "route cache" && git push) || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
